name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run test

      - name: Build
        run: npm run build
        env:
          # A placeholder is enough at build time — the route only checks
          # for presence to decide whether to attempt sending, and no
          # build step actually calls Resend.
          RESEND_API_KEY: build-time-placeholder
